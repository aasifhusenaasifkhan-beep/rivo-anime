<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#05080f;color:#f1f5f9;font:15px system-ui}main,header{max-width:640px;margin:auto;padding:12px 16px}
h2{color:#00ff88;text-align:center;margin:8px 0}h3{color:#00ff88}label{display:block;color:#94a3b8;font-size:12px;font-weight:700;margin:12px 0 2px}
#tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.tb{background:#0d111b;border:1px solid #16312d;color:#f1f5f9;padding:9px 13px;border-radius:10px;font-weight:700;font-size:13px}.tb.on{background:#00ff88;color:#000}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #16312d;background:#02050a;color:#f1f5f9;font:inherit;margin:3px 0}
.btn{display:block;width:100%;background:linear-gradient(90deg,#00ff88,#00e5ff);color:#000;font-weight:700;border:0;padding:13px;border-radius:12px;margin:12px 0;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0d111b;border:1px solid #16312d;border-radius:10px;padding:10px 12px;margin:8px 0;word-break:break-all}
.row2{background:#0d111b;border:1px solid #16312d;border-radius:12px;padding:10px;margin:10px 0}.row2 img{float:left;margin-right:10px;border-radius:8px;max-height:60px;object-fit:cover}.row2 b{display:block;margin-bottom:8px}.row2 div{clear:both;padding-top:6px}
.dd{background:#ff4455;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:700}#pvw{width:100%;display:none;border-radius:12px;margin:8px 0}</style></head><body>
<header><h2>⚙ Admin Control Center</h2><div id=tabs></div></header><main id=v></main>
<script>
const API='https://rivo-api.aasifhusenaasifkhan.workers.dev',$=s=>document.querySelector(s),V={};let P=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ad=async(a,b)=>{const r=await fetch(API+'/api/admin/'+a,{method:'POST',headers:{'x-admin':sessionStorage.ak||''},body:JSON.stringify(b||{})});const d=await r.json();if(!r.ok)throw d.error||'Error';return d};
async function act(a,b,cb){if(a.startsWith('del')&&!confirm('Pakka delete?'))return;try{await ad(a,b);cb&&cb()}catch(e){alert(e)}}
const T={post:'Add Post',ep:'Episodes',img:'Images',del:'Delete',sh:'Shorteners',vip:'VIP',ads:'Ads'};
const gate=()=>{$('#tabs').innerHTML='';$('#v').innerHTML='<h3>🔒 Admin Login</h3><input id=k type=password placeholder="Admin password"><button class=btn onclick=go()>Login</button><p id=out></p>'};
async function go(){sessionStorage.ak=$('#k').value;try{await ad('ping');panel()}catch(e){sessionStorage.ak='';$('#out').textContent='Galat password'}}
function panel(){$('#tabs').innerHTML=Object.entries(T).map(([k,v])=>`<button class=tb id=t_${k} onclick="tab('${k}')">${v}</button>`).join('')+'<button class=tb onclick="sessionStorage.ak=\'\';gate()">Logout</button>';tab('post')}
async function tab(k){document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.id=='t_'+k));try{await V[k]()}catch(e){$('#v').textContent=e}}
const KM={name:'name',animename:'name',title:'name',postname:'name',anime:'name',post:'name',category:'category',cat:'category',type:'category',genre:'genres',genres:'genres',tags:'genres',year:'year',releaseyear:'year',release:'year',story:'synopsis',shortstory:'synopsis',synopsis:'synopsis',plot:'synopsis',summary:'synopsis',description:'synopsis',image:'image',poster:'image',posterimage:'image',posterimageurl:'image',imagelink:'image',imageurl:'image',cover:'image',postlink:'image',season:'season',episode:'ep',ep:'ep',episodeno:'ep',download:'dl_link',downloadlink:'dl_link',dl:'dl_link',play:'play_link',playlink:'play_link',quality:'quality'};
function parse(t){const o={};let k=null;t.split('\n').forEach((l,i)=>{const s=l.trim();if(!s)return;
const m=s.match(/^([A-Za-z ]{2,22}?)\s*(?:[:：=]|\s[-–—]\s)\s*(.*)$/),f=m&&KM[m[1].toLowerCase().replace(/[^a-z]/g,'')];
if(f){k=f;o[k]=m[2].trim()}else if(/^https?:\/\//.test(s)){if(!o.image)o.image=s}else if(/^(#\S+\s*)+$/.test(s))o.genres=((o.genres||'')+' '+s).trim();else if(k)o[k]+=' '+s;else if(!o.name&&i==0)o.name=s});return o}
const pv=()=>{const u=$('#f_image').value;$('#pvw').src=u;$('#pvw').style.display=u?'block':'none'};
V.post=()=>{$('#v').innerHTML=`<h3>+ Post Add</h3><label>AUTO PASTE (yahan paste karo, neeche khud bhar jayega)</label><textarea id=pst rows=5 oninput=fill()></textarea><label>POSTER IMAGE URL</label><input id=f_image oninput=pv()><img id=pvw><label>ANIME NAME *</label><input id=f_name><label>CATEGORY *</label><input id=f_category><label>GENRES (comma ya # se alag karo)</label><input id=f_genres><label>RELEASE YEAR</label><input id=f_year><label>STORY</label><textarea id=f_synopsis rows=4></textarea><button class=btn onclick=addPost()>Publish Post</button><p id=out></p>`};
function fill(){const o=parse($('#pst').value);['name','category','genres','year','synopsis','image'].forEach(k=>{if(o[k]!=null)$('#f_'+k).value=o[k]});pv()}
async function addPost(){const b={};['name','category','genres','year','synopsis','image'].forEach(k=>b[k]=$('#f_'+k).value.trim());if(!b.name||!b.category)return alert('Name aur Category zaruri hai');try{await ad('addPost',b);V.post();$('#out').textContent='Post add ho gayi ✅'}catch(e){alert(e)}}
V.ep=async()=>{P=await ad('list',{t:'posts'});$('#v').innerHTML=`<h3>Add Episode</h3><label>AUTO PASTE</label><textarea id=pst rows=4 oninput=fill2()></textarea><input id=sq placeholder="Search post..." oninput=opts()><select id=sp onchange=eplist()></select><label>SEASON</label><input id=e_season placeholder="1"><label>EPISODE NO *</label><input id=e_ep placeholder="01"><label>QUALITY</label><select id=e_quality><option>FHD<option selected>HD<option>SD</select><label>PLAY LINK (optional)</label><input id=e_play_link><label>DOWNLOAD LINK *</label><input id=e_dl_link><button class=btn onclick=addEp()>+ Add Episode</button><p id=out></p><div id=el></div>`;opts()};
const opts=()=>{const q=$('#sq').value.toLowerCase();$('#sp').innerHTML=P.filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<option value=${p.id}>${esc(p.name)}</option>`).join('');eplist()};
async function eplist(){const id=$('#sp').value;if(!id)return $('#el').innerHTML='';const L=await ad('list',{t:'episodes',post_id:id});$('#el').innerHTML='<label>IS POST KE EPISODES</label>'+L.map(e=>`<div class=row><span>S${esc(e.season)} E${esc(e.ep)} <small>${esc(e.quality)}</small></span><button class=dd onclick="act('delEpisode',{id:${e.id}},eplist)">Delete</button></div>`).join('')}
function fill2(){const o=parse($('#pst').value);if(o.name){$('#sq').value=o.name;opts()}['season','ep','quality','play_link','dl_link'].forEach(k=>{if(o[k]!=null)$('#e_'+k).value=k=='quality'?o[k].toUpperCase():o[k]})}
async function addEp(){const b={post:$('#sp').value,season:$('#e_season').value||'1',ep:$('#e_ep').value,quality:$('#e_quality').value,play_link:$('#e_play_link').value,dl_link:$('#e_dl_link').value};if(!b.post||!b.ep||!b.dl_link)return alert('Post, Episode no aur Download link zaruri hai');try{await ad('addEpisode',b);['ep','play_link','dl_link'].forEach(k=>$('#e_'+k).value='');$('#out').textContent='Episode add ho gaya ✅';eplist()}catch(e){alert(e)}}
V.img=async()=>{P=await ad('list',{t:'posts'});$('#v').innerHTML='<h3>Post Images</h3>'+P.map(p=>`<div class=row2><img src="${esc(p.image)}" width=70><b>${esc(p.name)}</b><div><input id=im${p.id} value="${esc(p.image)}"><button class=btn style="margin:6px 0" onclick="act('setImage',{id:${p.id},image:$('#im${p.id}').value},()=>alert('Update ho gaya ✅'))">Update</button></div></div>`).join('')};
V.del=async()=>{P=await ad('list',{t:'posts'});$('#v').innerHTML='<h3>Delete Post</h3><input id=sq placeholder="Search post..." oninput=dl2()><div id=el></div>';dl2()};
const dl2=()=>{const q=$('#sq').value.toLowerCase();$('#el').innerHTML=P.filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<div class=row><span>${esc(p.name)}</span><button class=dd onclick="act('delPost',{id:${p.id}},V.del)">Delete</button></div>`).join('')};
V.sh=async()=>{const L=await ad('list',{t:'shorteners'});$('#v').innerHTML=`<h3>Shorteners (max 3)</h3>${L.map(s=>`<div class=row><span>${esc(s.home)}</span><div style="display:flex;gap:6px"><button class=dd style="background:#00ff88;color:#000" onclick="tst(${s.id})">Test</button><button class=dd onclick="act('delShortener',{id:${s.id}},V.sh)">Delete</button></div></div>`).join('')}<label>HOME URL</label><input id=s_home placeholder="https://gplinks.in"><label>API KEY</label><input id=s_api><button class=btn onclick="act('addShortener',{home:$('#s_home').value,api:$('#s_api').value},V.sh)">+ Add Shortener</button>`};
V.vip=async()=>{const L=await ad('list',{t:'users'});$('#v').innerHTML=`<h3>VIP Users</h3>${L.map(u=>`<div class=row><span>${esc(u.email)}</span><button class=dd onclick="act('delUser',{email:'${esc(u.email)}'},V.vip)">Delete</button></div>`).join('')}<label>GMAIL ID</label><input id=u_email><label>PASSWORD</label><input id=u_pass><button class=btn onclick="act('addUser',{email:$('#u_email').value,pass:$('#u_pass').value},V.vip)">+ Add VIP User</button>`};
V.ads=async()=>{const c=(await ad('list',{t:'popup'}))[0]?.script||'';$('#v').innerHTML=`<h3>Pop-up Ads</h3><label>AD SCRIPT</label><textarea id=ad rows=6>${esc(c)}</textarea><button class=btn onclick="act('setPopup',{script:$('#ad').value},()=>alert('Save ho gaya ✅'))">Save Ad</button><button class=btn style="background:#ff4455;color:#fff" onclick="act('delPopup',{},V.ads)">Delete Ad</button>`};
async function tst(id){try{const r=await ad('testShortener',{id});alert('✅ Chal gaya: '+r.url)}catch(e){alert('❌ '+e)}}
sessionStorage.ak?ad('ping').then(panel).catch(gate):gate();
</script></body></html>
