<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rivo Anime</title><meta name="description" content="Rivo Anime - Hindi Dubbed & Subbed Anime download"><meta name="google-site-verification" content="YOUR_GOOGLE_CODE">
<style>
:root{--bg:#05080f;--c:#0d111b;--b:#16312d;--g1:#00ff88;--g2:#00e5ff;--t:#f1f5f9;--m:#94a3b8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px Roboto,system-ui,sans-serif;padding-bottom:72px}
header{text-align:center;padding:14px 12px 2px}header b{font-size:26px;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{display:flex;justify-content:space-between;padding:4px 14px;border-bottom:1px solid var(--b)}.ib{background:none;border:0;color:var(--t);font-size:24px}
main{max-width:900px;margin:auto;padding:14px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:block;color:inherit;text-decoration:none;background:var(--c);border:1px solid var(--b);border-radius:20px;overflow:hidden}
.im{position:relative}.im img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.bd{position:absolute;background:#000b;border:1px solid var(--b);color:var(--g1);font-weight:700;font-size:13px;padding:6px 12px;border-radius:99px}
.card h3{margin:14px 16px;font-size:19px}.go{display:block;text-align:center;text-decoration:none;background:var(--g1);color:#000;font-weight:700;padding:13px;border-radius:14px;border:0;font-size:16px;width:calc(100% - 28px);margin:0 14px 14px;user-select:none;touch-action:none}
.pc{background:var(--c);border:1px solid var(--b);border-radius:20px;overflow:hidden;padding-bottom:14px}.pc>*:not(.ban){margin-left:18px;margin-right:18px}
.ban{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;-webkit-mask-image:linear-gradient(#000 75%,transparent);mask-image:linear-gradient(#000 75%,transparent)}
h1{color:var(--g1);margin:0 18px 10px;font-size:26px}h6{color:var(--m);letter-spacing:1px;margin:14px 18px 6px;font-size:12px}
.pl{display:inline-block;background:#1a2030;border:1px solid #2a3350;padding:5px 12px;border-radius:99px;margin:3px 6px 3px 0;font-size:13px;font-weight:700;cursor:pointer;color:var(--t)}.or{background:#ff8c00;color:#000;border:0}
.c0{color:#b57cff;background:#241a44}.c1{color:#5aa0ff;background:#12264a}.c2{color:#34e0a1;background:#0e3a30}
h2{margin:22px 4px 10px}h2 small{float:right;color:var(--m);font-size:12px}
.tab{background:var(--c);border:1px solid var(--b);color:var(--t);border-radius:12px;padding:8px 12px;margin:0 6px 8px 0;text-align:center}.tab b{display:block;font-size:14px}.tab small{font-size:11px;color:var(--m)}.tab.on{background:linear-gradient(90deg,var(--g1),var(--g2));color:#000}.tab.on small{color:#000}
.sg{color:var(--g1);margin:10px 4px}.qb{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:12px 14px;margin-bottom:14px}.qh{color:var(--m);font-size:13px;padding-bottom:10px;border-bottom:1px solid var(--b)}
.qt{display:inline-block;padding:3px 12px;border-radius:8px;font-weight:700;margin-right:6px;background:#12264a;color:#5aa0ff}.qt.FHD{background:#0e3a30;color:#34e0a1}
.er{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--b)}.er:last-child{border:0}.er small{color:var(--m)}
.dl,.vp,.pb{border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;margin-left:6px;border:0;text-decoration:none}.dl{background:linear-gradient(90deg,var(--g1),var(--g2));color:#000}.vp{background:none;border:1px solid #a8861c;color:#ffc933}.pb{background:#1a2030;color:var(--g1)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);z-index:6}nav button{flex:1;background:none;border:0;color:var(--m);padding:10px;font-size:12px}nav span{display:block;font-size:20px}
#drawer{position:fixed;inset:0 25% 0 0;background:var(--c);padding:16px;transform:translateX(-110%);transition:.2s;z-index:9;overflow:auto}#drawer.o{transform:none}
.m{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20}.m>div{background:var(--c);border:1px solid var(--b);padding:18px;border-radius:16px;width:min(92%,360px)}.m .go{width:100%;margin:8px 0}
input{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:1px solid var(--b);background:var(--bg);color:var(--t);font:inherit}
.bx{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:14px 18px;margin-top:14px}.bx h6{margin:0 0 8px}.bx p{margin:0;line-height:1.5}
.eb{display:flex;flex-direction:column;gap:8px}.eb .dl,.eb .vp,.eb .pb{width:130px;height:42px;margin:0;padding:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.pl.sel{background:var(--g1);color:#000;border-color:var(--g1)}
</style></head><body>
<header><b>Rivo Anime</b></header><div class=bar><button class=ib onclick="openD()">•••</button><button class=ib onclick="srch()">🔍</button></div>
<div id=ov onclick="closeD()" style="display:none;position:fixed;inset:0;z-index:8"></div><div id=drawer></div><main id=v></main>
<nav><button onclick="filt()"><span>🏠</span>Home</button><button onclick="login()"><span>💎</span>VIP Pass</button></nav>
<div class=m id=m onclick="if(event.target==this)closeM()"><div id=md></div></div>
<script>
const API='https://rivo-api.aasifhusenaasifkhan.workers.dev',$=s=>document.querySelector(s);
let S={cat:'',genre:'',q:'',az:'',page:1},max=1,tok=localStorage.tok||'',meta={},E=[],cs=null;
const cap=s=>String(s).replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const sl=(n,id)=>String(n).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+id,sn=s=>String(s).replace(/^season\s*/i,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,b)=>{const r=await fetch(API+p,{method:b?'POST':'GET',headers:{authorization:'Bearer '+tok},body:b?JSON.stringify(b):undefined});const d=await r.json();if(!r.ok)throw d.error||'Error';return d};
const modal=h=>{$('#md').innerHTML=h;$('#m').style.display='flex'},closeM=()=>$('#m').style.display='none';
function hold(b,cb,label){let t,i,n;const L=label+' (5 sec dabao)',clr=()=>{clearTimeout(t);clearInterval(i);b.textContent=L};b.textContent=L;
b.onpointerdown=e=>{e.preventDefault();n=5;b.textContent=n+'...';i=setInterval(()=>b.textContent=--n+'...',1000);t=setTimeout(()=>{clr();cb()},5000)};
b.onpointerup=b.onpointerleave=clr;b.oncontextmenu=e=>e.preventDefault()}
async function feed(){const q=new URLSearchParams(Object.fromEntries(Object.entries(S).filter(([,v])=>v)));const d=await api('/api/posts?'+q);max=d.pages||1;
$('#v').innerHTML=`${chip()}<div class=g>${d.posts.map(p=>`<a class=card href="/anime/${sl(p.name,p.id)}" onclick="event.preventDefault();post(${p.id})"><div class=im><img src="${esc(p.image)}" loading=lazy><span class=bd style="left:12px;top:12px">WATCH NOW</span><span class=bd style="right:12px;top:12px">${esc(p.category)}</span></div><h3>${esc(p.name)}</h3><div class=go>▶ Watch Episode</div></a>`).join('')||'<p>Is category aur genre ki koi post nahi hai</p>'}</div><p style="text-align:center"><button class=pl onclick="pg(-1)">◀</button> ${S.page}/${max} <button class=pl onclick="pg(1)">▶</button></p>`}
const pg=d=>{S.page=Math.min(max,Math.max(1,S.page+d));feed()};
let inApp=false,sel={cat:'',genres:[]};
const chip=()=>S.cat||S.genre?`<p style="margin:0 0 12px">🔎 ${esc([S.cat,...(S.genre?S.genre.split(',').map(cap):[])].filter(Boolean).join(' • '))} <button class=pl onclick="filt()">✕ Hata do</button></p>`:'';
const curG=()=>sel.cat&&meta.cg&&meta.cg[sel.cat]?meta.cg[sel.cat]:meta.genres;
const selC=i=>{const c=meta.cats[i];sel.cat=sel.cat==c?'':c;const g=curG();sel.genres=sel.genres.filter(x=>g.includes(x));menu()};
const selG=i=>{const g=curG()[i];sel.genres=sel.genres.includes(g)?sel.genres.filter(x=>x!=g):[...sel.genres,g];menu()};
function applySel(){S={cat:sel.cat,genre:sel.genres.join(','),q:'',az:'',page:1};closeD();if(location.pathname!='/'){history.pushState(0,'','/');inApp=true}feed()}
const closeD=()=>{$('#drawer').classList.remove('o');$('#ov').style.display='none'},openD=()=>{$('#drawer').classList.add('o');$('#ov').style.display='block'};
function filt(k,v){S={cat:'',genre:'',q:'',az:'',page:1};if(k)S[k]=v;sel={cat:S.cat,genres:S.genre?S.genre.split(','):[]};menu();closeD();if(location.pathname!='/'){history.pushState(0,'','/');inApp=true}feed()}
const goBack=()=>inApp?history.back():filt();
function route(){closeD();closeM();const pm=location.pathname.match(/^\/anime\/.*-(\d+)\/?$/);pm?post(pm[1],false):feed()}
addEventListener('popstate',route);
const srch=()=>{const q=prompt('Anime ka naam?');if(q!==null)filt('q',q)};
function menu(){const st=$('#drawer').scrollTop,L=meta.links||{},ln=(u,t)=>/^https?:\/\//.test(u||'')?`<a class=go style="width:100%;margin:8px 0" href="${esc(u)}" target=_blank>${t}</a>`:'',G=curG();
$('#drawer').innerHTML=`<div style="position:sticky;top:-16px;background:var(--c);padding:8px 0;display:flex;gap:8px;align-items:center;z-index:2"><button class=go style="margin:0;flex:1;width:auto" onclick="applySel()">✅ Done</button><button class=pl onclick="filt()">Reset</button><button class=ib onclick="closeD()">✕</button></div><h3>Category</h3>${meta.cats.map((x,i)=>`<span class="pl${sel.cat==x?' sel':''}" onclick="selC(${i})">${esc(x)}</span>`).join('')}<h3>Genre <small style="font-weight:400;color:var(--m)">(ek se zyada chun sakte ho)</small></h3>${G.map((x,i)=>`<span class="pl${sel.genres.includes(x)?' sel':''}" onclick="selG(${i})">${esc(cap(x))}</span>`).join('')}<h3>A-Z / 0-9</h3>${[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ','0-9'].map(x=>`<span class=pl onclick="filt('az','${x}')">${x}</span>`).join('')}<br><br><button class=go style="width:100%;margin:8px 0" onclick="login()">Gmail Login</button>${ln(L.c,'📢 Telegram Channel')}${ln(L.g,'👥 Telegram Group')}`;$('#drawer').scrollTop=st}
async function post(id,push=true){const{post:p,eps}=await api('/api/post/'+id);E=eps;cs=null;
$('#v').innerHTML=`<button class=pl onclick="goBack()" style="font-size:15px;margin-bottom:10px">← Back</button><div class=pc><img class=ban src="${esc(p.image)}"><h1>${esc(p.name)}</h1><div style="margin:0 18px"><span class="pl or">${esc(p.category)}</span></div></div><div class=bx><h6>GENRES</h6><div>${p.genres.split(' ').filter(Boolean).map((g,i)=>`<span class="pl c${i%3}" onclick="filt('genre','${esc(g)}')">${esc(cap(g))}</span>`).join('')||'-'}</div></div>${p.year?`<div class=bx><h6>RELEASE DATE</h6><span class=pl>📅 ${esc(p.year)}</span></div>`:''}${p.synopsis?`<div class=bx><h6>SHORT STORY</h6><p>${esc(p.synopsis)}</p></div>`:''}<h2>⬢ Download <small>${eps.length} total</small></h2><div id=tabs></div><div id=el></div>`;
epl();document.title=p.name+' | Rivo Anime';if(push){history.pushState(0,'','/anime/'+sl(p.name,id));inApp=true};scrollTo(0,0)}
function epl(){const by={};E.forEach(e=>(by[e.season]??=[]).push(e));const ks=Object.keys(by).sort((a,b)=>parseInt(sn(a))-parseInt(sn(b)));cs=by[cs]?cs:ks[0];
const n=l=>l.length+(l.length>1?' entries':' entry');
$('#tabs').innerHTML=ks.map(k=>`<button class="tab${k==cs?' on':''}" onclick="cs='${esc(k)}';epl()"><b>Season ${esc(sn(k))}</b><small>${n(by[k])}</small></button>`).join('');
const q={};(by[cs]||[]).forEach(e=>(q[e.quality]??=[]).push(e));
$('#el').innerHTML=`<h3 class=sg>Season ${esc(sn(cs))}</h3>`+Object.entries(q).sort((a,b)=>'FHD,HD,SD'.indexOf(a[0])-'FHD,HD,SD'.indexOf(b[0])).map(([k,l])=>`<div class=qb><div class=qh><span class="qt ${esc(k)}">${esc(k)}</span>Quality • ${n(l)}</div>${l.map(e=>`<div class=er><div><b>${/^\d+$/.test(e.ep)?'Episode ':'Episodes '}${esc(e.ep)}</b><br><small>Season ${esc(sn(e.season))} • Quality ${esc(e.quality)}</small></div><div class=eb><button class=dl onclick="dl(${e.id})">⬇ Download</button><button class=vp onclick="vip(${e.id})">💎 VIP</button>${e.play_link?`<a class=pb href="${esc(e.play_link)}" target=_blank>▶ Play</a>`:''}</div></div>`).join('')}</div>`).join('')}
function dl(ep){modal(`<h3>Solve Shortener</h3>`+(meta.shorts.length?meta.shorts.map(s=>`<button class=go data-s=${s.id}></button>`).join(''):'Shortener set nahi hai'));
document.querySelectorAll('[data-s]').forEach(b=>hold(b,async()=>{try{location.href=(await api('/api/dl/start',{ep,sid:b.dataset.s})).url}catch(e){alert(e)}},'Solve '+meta.shorts.find(s=>s.id==b.dataset.s).n))}
async function vip(ep){try{const r=await api('/api/dl',{ep});if(r.link)modal(`<h3>💎 VIP Download</h3><a class=go style="width:100%;margin:8px 0" href="${esc(r.link)}">Direct Link</a>`);else login()}catch(e){alert(e)}}
const login=()=>{closeD();modal(`<h3>VIP Login</h3><input id=em placeholder=Gmail><input id=pw type=password placeholder=Password><button class=go onclick="doLogin()" style="width:100%;margin:8px 0">Login</button>`)};
async function doLogin(){try{tok=(await api('/api/login',{email:$('#em').value,pass:$('#pw').value})).token;localStorage.tok=tok;closeM();alert('VIP login ho gaya')}catch(e){alert(e)}}
(async()=>{try{meta=await api('/api/meta')}catch(e){return $('#v').textContent='API set karo (API const)'}
if(meta.popup){const t=document.createElement('template');t.innerHTML=meta.popup;t.content.querySelectorAll('script').forEach(o=>{const s=document.createElement('script');[...o.attributes].forEach(a=>s.setAttribute(a.name,a.value));s.textContent=o.textContent;document.body.append(s)})}
const pm=location.pathname.match(/^\/anime\/.*-(\d+)\/?$/),pid=pm&&pm[1];menu();pid?post(pid,false):feed();
const f=new URLSearchParams(location.search).get('f');
if(f){modal(`<h3>Verify</h3><button class=go id=vb style="width:100%;margin:8px 0"></button>`);hold($('#vb'),async()=>{try{const r=await api('/api/dl/verify',{f});modal(`<a class=go style="width:100%;margin:8px 0" href="${esc(r.link)}">Link kholo</a>`)}catch(e){modal(`<p>${esc(e)}</p>`)}},'Get Link verify')}})();
</script></body></html>
